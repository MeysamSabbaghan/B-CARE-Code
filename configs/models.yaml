    revision: 2db69c1c3e91a05d2c64a3185acfbaf36f744e25
    dtype: bfloat16
    model_class: AutoModelForCausalLM
  Mistral:
    # Manuscript shorthand “Mistral Small 3.2 24B” ↔ Hub Instruct-2501 snapshot.
    hf_model_id: mistralai/Mistral-Small-24B-Instruct-2501
    revision: 9527884be6e5616bdd54de542f9ae13384489724
    dtype: bfloat16
    model_class: AutoModelForCausalLM
