verifier_openrouter:
  model: meta-llama/llama-3.3-70b-instruct
  temperature: 0.0
  max_tokens_evidence: 80
  max_tokens_edcv: 16
  note: OpenRouter revision string is unknowable via the API.

llamaprob_self_hosted:
  hf_model_id: meta-llama/Llama-3.3-70B-Instruct
  revision: 6f6073b423013f6a7d4d9f39144961bfbfbc386b
  dtype: bfloat16
  log_softmax_dtype: float32
  scoring: teacher_forced_sequence_logprob_closed_set_softmax
  risk: "1 - P(base_pred)"
  hardware_note: Typically 2×A100-80GB (or equivalent multi-GPU host)

nli:
  hf_model_id: microsoft/deberta-v2-xlarge-mnli

decoding:
  base:
    do_sample: false
    temperature_config_unused: 0.2
    max_new_tokens: 16
    seed: 2026092701
  same_model_evidence:
    do_sample: false
    temperature_config_unused: 0.0
    max_new_tokens: 96
    seed: 2026092701
  uncertainty_sampling:
    M: 5
    temperature: 1.0
    top_p: 0.9
    max_new_tokens: 8
    seed: 42
  p_true:
    num_fewshot: 20
    num_brainstorm: 10
    fewshot_seed: 2026092817
    brainstorm_temperature: 1.0
    fewshot_low_t_temperature: 0.1
    # Matches original suite YAML risk_definition and p_true_official.py
    # (jlko p_false_fixed = 1 - exp(log_p_A) = 1 - P(token " A")).
    risk: "1 - exp(log_p_A)"
