# B-CARE evaluation datasets (4 datasets → 12 settings with 3 bases).
# Raw data are NOT redistributed. Point --raw-root at locally obtained copies.

semeval:
  display_name: SemEval-2016 Task 6A
  citation: Mohammad et al., SemEval-2016 Task 6
  official_url: https://alt.qcri.org/semeval2016/task6/
  raw_subdir: semeval2016
  raw_test_file: test.csv
  split: test
  eval_n: 1249
  exclude_targets: ["Donald Trump"]
  expected_targets:
    - Atheism
    - Climate Change is a Real Concern
    - Feminist Movement
    - Hillary Clinton
    - Legalization of Abortion
  gold_map: {NEUTRAL: NONE}
  labels: [FAVOR, AGAINST, NONE]
  prompt_kind: ternary
  manifest_sha256: 6f12604c6d06ceef2825758ba278f54ecc0a47307e1f28bf478514f99f15a4f5

vaccines:
  display_name: VaccineStance
  citation: >
